name: Build APK

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Podpisový klíč z tajných proměnných
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=lkwnav\n' \
              "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
          else
            echo "::warning::Chybí KEYSTORE_BASE64 – APK bude podepsané zkušebním klíčem"
          fi
      # Server sítě parkovišť: projekt Supabase „LKWnav“ (backend/network/schema.sql). Veřejný klíč patří
      # do aplikace (data chrání pravidla serveru); jiný server = proměnné repozitáře NET_URL / NET_KEY.
      # Jedno APK jen pro 64bitové ARM telefony (Samsung S24 Ultra a všechny novější Androidy).
      - run: >-
          flutter build apk --release --target-platform android-arm64
          --dart-define=NET_URL=${{ vars.NET_URL || 'https://mpaiwlcjupqnipgrxetw.supabase.co/rest/v1' }}
          --dart-define=NET_KEY=${{ vars.NET_KEY || 'sb_publishable_NfwvhvQeN2wh-LQe-OzEiQ_UgWxBRlc' }}
      - uses: actions/upload-artifact@v4
        with:
          name: lkwnav-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
